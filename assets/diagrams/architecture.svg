<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F3; }
      .box { fill: #FFFFFF; stroke: #141414; stroke-width: 1.5; rx: 4px; }
      .accent-box { fill: #141414; rx: 4px; }
      .accent-text { fill: #F7F6F3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .title-text { fill: #141414; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; letter-spacing: 0.05em; }
      .body-text { fill: #6E6B65; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .line { stroke: #141414; stroke-width: 1.5; fill: none; }
      .dashed-line { stroke: #9E9B93; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .arrow { fill: #141414; }
      .header-title { fill: #141414; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.1em; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Title -->
  <text x="40" y="45" class="header-title">SYSTEM ARCHITECTURE &amp; DATA FLOW</text>

  <!-- Layer 1: App Root & Global Layout -->
  <g transform="translate(300, 70)">
    <rect width="300" height="55" class="accent-box"/>
    <text x="150" y="26" class="accent-text">ROOT LAYOUT (app/layout.tsx)</text>
    <text x="150" y="44" fill="#C44D34" font-family="monospace" font-size="10" text-anchor="middle">Google Fonts · Global Nav · Footer Shell</text>
  </g>

  <!-- Connection: Layout to Page Transition -->
  <path d="M 450 125 L 450 155" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 2: Page Transition Wrapper -->
  <g transform="translate(325, 160)">
    <rect width="250" height="45" class="box"/>
    <text x="125" y="22" class="title-text">PAGE TRANSITION</text>
    <text x="125" y="36" class="body-text">Framer Motion Crossfade (AnimatePresence)</text>
  </g>

  <!-- Connection: Split to Routes -->
  <path d="M 450 205 L 450 230" class="line"/>
  <path d="M 125 230 L 775 230" class="line"/>
  <path d="M 125 230 L 125 255" class="line" marker-end="url(#arrow)"/>
  <path d="M 340 230 L 340 255" class="line" marker-end="url(#arrow)"/>
  <path d="M 560 230 L 560 255" class="line" marker-end="url(#arrow)"/>
  <path d="M 775 230 L 775 255" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 3: Application Routes -->
  <!-- Route 1: Homepage -->
  <g transform="translate(40, 260)">
    <rect width="170" height="70" class="box"/>
    <text x="85" y="24" class="title-text">HOMEPAGE (/)</text>
    <text x="85" y="42" class="body-text">Hero Exhibition</text>
    <text x="85" y="58" class="body-text">6 Featured Projects Grid</text>
  </g>

  <!-- Route 2: All Work Index -->
  <g transform="translate(255, 260)">
    <rect width="170" height="70" class="box"/>
    <text x="85" y="24" class="title-text">ALL WORK (/work)</text>
    <text x="85" y="42" class="body-text">Unified Project Index</text>
    <text x="85" y="58" class="body-text">3-Column Grid Display</text>
  </g>

  <!-- Route 3: Dynamic Case Study -->
  <g transform="translate(470, 260)">
    <rect width="180" height="70" class="accent-box"/>
    <text x="90" y="24" class="accent-text">CASE STUDY (/work/[slug])</text>
    <text x="90" y="42" fill="#E2DFD8" font-family="sans-serif" font-size="11" text-anchor="middle">SSG Static Generation</text>
    <text x="90" y="58" fill="#C44D34" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Auto Masonry Gallery</text>
  </g>

  <!-- Route 4: About & Contact -->
  <g transform="translate(690, 260)">
    <rect width="170" height="70" class="box"/>
    <text x="85" y="24" class="title-text">ABOUT &amp; CONTACT</text>
    <text x="85" y="42" class="body-text">Profile &amp; Disciplines</text>
    <text x="85" y="58" class="body-text">Inquiry Gateway &amp; Mailto</text>
  </g>

  <!-- Layer 4: Data Layer & Media Engine (Bottom) -->
  <g transform="translate(100, 395)">
    <rect width="320" height="85" class="box"/>
    <text x="160" y="24" class="title-text">TYPED CONTENT LAYER</text>
    <text x="160" y="44" class="body-text">content/projects/*.ts (15 project definitions)</text>
    <text x="160" y="62" class="body-text">lib/types.ts (Project, MediaItem, Section)</text>
  </g>

  <g transform="translate(480, 395)">
    <rect width="320" height="85" class="box"/>
    <text x="160" y="24" class="title-text">AUTOMATIC MEDIA DISCOVERY</text>
    <text x="160" y="44" class="body-text">lib/gallery.ts (Build-Time FS Scanner)</text>
    <text x="160" y="62" class="body-text">public/images/[slug] &amp; public/videos/[slug]</text>
  </g>

  <!-- Connections: Content to Routes -->
  <path d="M 260 395 L 260 350 L 560 350 L 560 335" class="dashed-line" marker-end="url(#arrow)"/>
  <path d="M 640 395 L 640 335" class="dashed-line" marker-end="url(#arrow)"/>
</svg>
